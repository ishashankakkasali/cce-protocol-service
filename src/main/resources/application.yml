# ==============================================================================
# CCE Protocol Service — Application Configuration
# ==============================================================================

server:
  port: ${SERVER_PORT:8090}

spring:
  application:
    name: cce-protocol-service

  # --- DataSource ---
  # Shared ccedb. DB_PORT defaults to the standard 5432; set it to 5433 to reach the instance
  # deployed by cce-collector-service.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ccedb}
    username: ${DB_USERNAME:cce_user}
    password: ${DB_PASSWORD:cce_pass}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:600000}
      max-lifetime: ${DB_MAX_LIFETIME:1800000}

  # --- JPA / Hibernate ---
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # --- Flyway ---
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # 0 for a new database: Flyway applies V1, the greenfield migration, then V2 as a no-op.
    #
    # Set CCE_FLYWAY_BASELINE_VERSION=1 for the one-time deployment against a database that already
    # holds the 1.x (pre-split) schema. Flyway then records V1 as already applied and runs only V2,
    # which performs the upgrade. Return it to 0 afterwards.
    #
    # This cannot be inferred from whether the schema is empty. ccedb is shared: the collector service
    # deploys it and other services may already hold tables in it, so an empty-schema check would not
    # distinguish a greenfield database from a 1.x one.
    baseline-version: ${CCE_FLYWAY_BASELINE_VERSION:0}
    out-of-order: true
    table: flyway_schema_history_protocol

# --- Actuator ---
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: cce-protocol-service

# --- Logging ---
logging:
  level:
    root: INFO
    org.hibernate: WARN
    org.openphc.cce.protocol: INFO
